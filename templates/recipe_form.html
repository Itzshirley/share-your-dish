{% extends 'base.html' %}{% block title %}Share a recipe | Share Your Dish{% endblock %}{% block content %}<main class="page-main"><section class="form-panel"><p class="eyebrow">Pass a good thing along</p><h1>Share your dish</h1><p>Add the recipe you love making. Photos help everyone imagine the first bite.</p><form method="post" enctype="multipart/form-data" class="form-stack"><label>Recipe title<input name="title" maxlength="255" required value="{{ recipe.get('title','') }}"></label><label>Category<select name="category" required>{% for key,label in categories.items() %}<option value="{{ key }}" {% if recipe.get('category','dinner') == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label class="check-row"><input type="checkbox" name="is_budget_friendly" value="1" {% if recipe.get('is_budget_friendly') %}checked{% endif %}> This recipe is budget-friendly</label><label>Short description<textarea name="description" rows="3" required>{{ recipe.get('description','') }}</textarea></label><label>Ingredients<textarea name="ingredients" rows="6" placeholder="One ingredient per line" required>{{ recipe.get('ingredients','') }}</textarea></label><label>Instructions<textarea name="instructions" rows="7" placeholder="One step per line" required>{{ recipe.get('instructions','') }}</textarea></label><label>Recipe photo<input type="file" name="image" accept="image/jpeg,image/png,image/webp,image/gif"><small>JPG, PNG, WebP or GIF, up to 4 MB</small></label><button class="button" type="submit">Publish recipe</button></form></section></main>{% endblock %}
